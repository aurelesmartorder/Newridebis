export class EventBus {
  constructor(){ this.listeners = new Map(); }
  on(name, fn){ const set=this.listeners.get(name)||new Set(); set.add(fn); this.listeners.set(name,set); return ()=>set.delete(fn); }
  emit(name, payload){ for(const fn of this.listeners.get(name)||[]) { try{ fn(payload); }catch(err){ console.error(`[NewRide:${name}]`,err); } } }
}
export const bus = new EventBus();
