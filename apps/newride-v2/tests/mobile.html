<!doctype html>
<html lang="fr">
  <meta charset="utf-8" /><title>NewRide — recette responsive</title
  ><style>
    body {
      margin: 0;
      background: #dbe0d7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 15px;
      font: 12px system-ui;
    }
    iframe {
      width: 390px;
      height: 800px;
      border: 0;
      box-shadow: 0 15px 60px #182c3525;
      border-radius: 20px;
      background: #f5f3ef;
    }
    select {
      padding: 8px;
      border: 1px solid #aaa;
      border-radius: 7px;
      background: white;
    }</style
  ><label
    >Largeur de recette
    <select aria-label="Largeur de recette">
      <option>320</option>
      <option selected>390</option>
      <option>768</option>
    </select>
    px</label
  ><iframe src="/" title="NewRide mobile"></iframe>
  <script>
    document
      .querySelector("select")
      .addEventListener(
        "change",
        (e) =>
          (document.querySelector("iframe").style.width =
            e.target.value + "px"),
      );
  </script>
</html>
